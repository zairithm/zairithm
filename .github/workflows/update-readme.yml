name: Update profile cards

on:
  schedule:
    - cron: "30 0 * * *"   # every day at 6:00 AM IST
  workflow_dispatch:
  push:
    paths:
      - scripts/build_profile.py
      - assets/photo.jpg

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_profile.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md cards/ data/
          git diff --cached --quiet || (git commit -m "chore: refresh profile cards" && git push)
